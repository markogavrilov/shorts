# ============================================================
#  Настройки нарезчика. У каждого компьютера свой список каналов.
# ============================================================

# Каналы Twitch, за которыми следит ЭТОТ компьютер (ник из ссылки twitch.tv/<ник>).
# M5 / M3: 3-4 канала, Mac 2015: 1-2 канала.
channels = ["streamer_one", "streamer_two"]

# Куда складывать клипы
output_dir = "clips"

# Сколько клипов собирать одновременно (1 для старого Mac, 2 для M3/M5)
render_workers = 1


[detect]
# Окно, в котором считаем сообщения чата (секунды)
window_seconds = 5
# Сколько минут чата брать для «обычного уровня»
baseline_minutes = 5
# Во сколько раз чат должен превысить обычный уровень, чтобы это считалось моментом
spike_ratio = 3.0
# Минимум сообщений в окне (защита от маленьких стримов, где 3 сообщения = «всплеск»)
min_messages = 12
# Пауза между клипами одного стримера (секунды)
cooldown_seconds = 60
# Сколько секунд слушать чат после старта, прежде чем резать
warmup_seconds = 90


[clip]
# Длина клипа (секунды)
length_seconds = 30
# Чат реагирует позже самого момента: на столько секунд «отматываем» назад
reaction_delay_seconds = 6
# Сколько секунд оставить ПОСЛЕ момента (реакция стримера)
after_moment_seconds = 8
# Сколько секунд стрима держать в памяти
buffer_seconds = 240
# Качество потока Twitch
quality = "best"


[edit]
# Раскладка кадра 9:16:
#   "square"  – игра крупно по центру (квадрат), сверху/снизу размытый фон  (по умолчанию)
#   "wide"    – вся картинка 16:9 по центру, размытый фон
#   "facecam" – вебка стримера сверху, игра снизу (укажите facecam ниже)
layout = "square"
# Где вебка на экране стрима, в долях кадра: [x, y, ширина, высота]
# Пример: вебка в правом нижнем углу -> [0.75, 0.70, 0.25, 0.30]
facecam = [0.75, 0.70, 0.25, 0.30]
font = "Arial Black"
fps = 30
subtitles = true
# Язык стрима для субтитров ("ru", "en" ...) или "auto"
language = "ru"
# Модель распознавания речи: "auto" сам выберет под компьютер
whisper_model = "auto"
# Звуковые эффекты (вжух в начале, удар на моменте)
sfx = true
# Тексты-хуки сверху в первые секунды. {streamer} заменяется на ник.
hook_texts = [
  "{streamer} НЕ ОЖИДАЛ ЭТОГО",
  "ЧАТ В ШОКЕ",
  "ЭТО НАДО ВИДЕТЬ",
  "GTA 6 СЛОМАЛАСЬ?!",
  "СМОТРИ ДО КОНЦА",
  "ЧТО ОН СДЕЛАЛ?!",
  "{streamer} В ШОКЕ",
]


[unique]
# Уникализация каждого клипа (случайный зум, скорость, цвет, зерно, звук, метаданные)
enabled = true
# Сколько РАЗНЫХ уникальных версий делать из одного момента (для разных аккаунтов)
variants = 1


[telegram]
enabled = false
# Токен от @BotFather. Можно вместо этого задать переменную окружения TELEGRAM_BOT_TOKEN
bot_token = ""
# Ваш chat id. Узнать: напишите боту /start и запустите  ./start.command --telegram-setup
chat_id = ""
